name: Postman Collection Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'   # 02:30 UTC -> 08:00 IST
    - cron: '00 14 * * *'  # 14:00 UTC -> 19:30 IST
    - cron: '00 6 * * 1-5' # 06:00 UTC (Mon-Fri) -> 11:30 IST

jobs:
  run-postman-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Newman and htmlextra reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra
          
      - name: Run the Postman collection with Newman
        run: |
          newman run 'Inwarranty-flow Collection.postman_collection.json' \
            -e 'QA.postman_environment.json' \
            -d testData.csv \
            -r cli,htmlextra \
            --reporter-htmlextra-export ./newman/index.html
            
      - name: Newman Report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with: 
          name: Newman Report
          path: newman/*.html

      - name: Creating github page branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          publish_dir: newman/

      - name: Send Email Notifiation
        if: always()
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Phoenix InWarranty Flow Test Execution Notification
          to: titunchakraborty55@gmail.com
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
                Hi,
                Phoenix InWarranty Flow tests have been executed. The Reports have been published and the URL 
                is: https://titun033.github.io/Phoenix-InWarranty-Flow/
          
          









